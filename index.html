<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="김윤성의 개인 홈페이지 — AI, 수학, 철학, 언어학에 관심을 두고 좋아하는 일을 해보며 살아갑니다." />
    <title>김윤성 · 개인 홈페이지</title>
    <style>
      :root { --ink: #172033; --muted: #596579; --paper: #f8f5ee; --line: #d9d5cb; --accent: #aa4a2b; --blue: #dbe7ee; }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; min-width: 320px; color: var(--ink); background: radial-gradient(circle at 100% 0%, var(--blue) 0, transparent 32rem), var(--paper); font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; line-height: 1.75; }
      .page { width: min(100% - 2.5rem, 68rem); margin: 0 auto; padding: 2rem 0 4rem; }
      header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 2rem; border-bottom: 1px solid var(--line); }
      .mark { width: 2.75rem; height: 2.75rem; display: grid; place-items: center; color: white; background: var(--ink); border-radius: 50%; font-family: Georgia, serif; font-size: 1.3rem; }
      nav { display: flex; gap: 1rem; }
      nav a { color: var(--muted); font-size: 0.9rem; text-decoration: none; }
      nav a:hover, nav a:focus-visible { color: var(--accent); text-decoration: underline; }
      .intro { min-height: 25rem; display: grid; align-content: center; gap: 1.25rem; padding: 5rem 0; }
      .eyebrow { margin: 0; color: var(--accent); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; }
      h1, h2 { font-family: Georgia, "Times New Roman", "Batang", serif; }
      h1 { max-width: 9ch; margin: 0; font-size: clamp(3.2rem, 9vw, 6.6rem); font-weight: 500; letter-spacing: -0.06em; line-height: 0.98; }
      .lead { max-width: 35rem; margin: 0; color: var(--muted); font-size: clamp(1.05rem, 2vw, 1.3rem); word-break: keep-all; }
      .sections { display: grid; gap: 1rem; }
      section { padding: clamp(1.5rem, 4vw, 2.5rem); background: rgba(255, 255, 255, 0.62); border: 1px solid var(--line); border-radius: 1rem; }
      h2 { margin: 0 0 1rem; font-size: clamp(1.8rem, 4vw, 2.5rem); font-weight: 500; letter-spacing: -0.04em; }
      section p { max-width: 45rem; margin: 0; word-break: keep-all; }
      .tags { display: flex; flex-wrap: wrap; gap: 0.65rem; padding: 0; margin: 0; list-style: none; }
      .tags li { padding: 0.48rem 0.8rem; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); font-size: 0.98rem; }
      footer { padding-top: 2rem; color: var(--muted); font-size: 0.85rem; text-align: center; }
      @media (max-width: 480px) { .page { width: min(100% - 2rem, 68rem); padding-top: 1rem; } header { padding-bottom: 1.25rem; } nav { gap: 0.7rem; } .intro { min-height: 22rem; padding: 3.5rem 0; } .tags li { font-size: 0.92rem; } }
    </style>
  </head>
  <body>
    <main class="page">
      <header>
        <div class="mark" aria-label="김윤성">K</div>
        <nav aria-label="페이지 탐색"><a href="#about">소개</a><a href="#interests">관심사</a><a href="#hobbies">취미</a></nav>
      </header>
      <section class="intro" aria-labelledby="name">
        <p class="eyebrow">Personal notes</p>
        <h1 id="name">김윤성</h1>
        <p class="lead">좋아하는 건 다 해보면서 살고 싶은 사람입니다.</p>
      </section>
      <div class="sections">
        <section id="about" aria-labelledby="about-title"><p class="eyebrow">About</p><h2 id="about-title">소개</h2><p>호기심이 가는 것들을 깊이 들여다보고, 생각을 나누는 시간을 좋아합니다.</p></section>
        <section id="interests" aria-labelledby="interests-title"><p class="eyebrow">Interests</p><h2 id="interests-title">관심사</h2><ul class="tags"><li>AI의 black-box 문제 해결</li><li>신념을 가지는 AI</li><li>수학</li><li>철학</li><li>언어학</li></ul></section>
        <section id="hobbies" aria-labelledby="hobbies-title"><p class="eyebrow">Hobbies</p><h2 id="hobbies-title">취미</h2><ul class="tags"><li>보드게임</li><li>짧은 글쓰기</li><li>키보드 연주</li><li>드럼 연주</li><li>베이스 연주</li></ul></section>
      </div>
      <footer>© 김윤성</footer>
    </main>
  </body>
</html>
